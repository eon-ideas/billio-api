runtime: java17
service: default
instance_class: F2

# Explicitly set scaling parameters
automatic_scaling:
  max_instances: 1
  min_instances: 0
  target_cpu_utilization: 0.65

# Environment variables
env_variables:
  SUPABASE_JWT_SECRET: '%SUPABASE-JWT-SECRET%'
  SUPABASE_JWT_ISSUER: '%SUPABASE-JWT-ISSUER%'